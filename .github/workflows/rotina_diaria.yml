name: Rotina diaria - Drive para BigQuery

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 07:17 em Brasilia
  workflow_dispatch:
    inputs:
      simular:
        description: "Apenas simular (nao grava nada no BigQuery)"
        type: boolean
        default: false

concurrency:
  group: rotina-diaria
  cancel-in-progress: false

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Executar rotina
        env:
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          if [ "$SIMULAR" = "true" ]; then
            python rotina_diaria.py --origem drive --simular
          else
            python rotina_diaria.py --origem drive
          fi
